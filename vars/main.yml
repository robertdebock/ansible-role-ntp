---
# vars file for ntp

_ntp_packages:
  default:
    - ntp
  Alpine:
    - anacron
  Debian-13:
    - ntpsec
  Debian-n/a:
    - ntpsec
  RedHat-7:
    - ntp
  RedHat:
    - chrony
    - util-linux

# Packages that conflict with the NTP daemon, and need to be removed first.
_ntp_conflicting_packages:
  default: []
  Debian:
    - systemd-timesyncd

ntp_conflicting_packages: "{{ _ntp_conflicting_packages[ansible_facts['os_family']] | default(_ntp_conflicting_packages['default']) }}"

ntp_packages: "{{ _ntp_packages[ansible_facts['os_family'] ~ '-' ~ ansible_facts['distribution_major_version']] | default(_ntp_packages[ansible_facts['os_family']] | default(_ntp_packages['default'] )) }}"

# The directory the configuration file is placed in.
_ntp_configuration_directory:
  default: /etc
  Debian-13: /etc/ntpsec

ntp_configuration_directory: "{{ _ntp_configuration_directory[ansible_facts['os_family'] ~ '-' ~ ansible_facts['distribution_major_version']] | default(_ntp_configuration_directory['default']) }}"

# The file ntpd uses to store the clock drift.
_ntp_drift_file:
  default: /var/lib/ntp/ntp.drift
  Debian-13: /var/lib/ntpsec/ntp.drift

ntp_drift_file: "{{ _ntp_drift_file[ansible_facts['os_family'] ~ '-' ~ ansible_facts['distribution_major_version']] | default(_ntp_drift_file['default']) }}"

_ntp_configuration_file:
  default: ntp.conf
  Alpine: ntpd.conf
  RedHat-7: ntp.conf
  RedHat: chrony.conf

ntp_configuration_file: "{{ _ntp_configuration_file[ansible_facts['os_family'] ~ '-' ~ ansible_facts['distribution_major_version']] | default(_ntp_configuration_file[ansible_facts['os_family']] | default(_ntp_configuration_file['default'] )) }}"

_ntp_service:
  default: ntpd
  Debian: ntp
  Debian-13: ntpsec
  Alpine: openntpd
  RedHat-7: ntpd
  RedHat: chronyd

ntp_service: "{{ _ntp_service[ansible_facts['os_family'] ~ '-' ~ ansible_facts['distribution_major_version']] | default(_ntp_service[ansible_facts['os_family']] | default(_ntp_service['default'] )) }}"

_ntp_timezone_packages:
  default:
    - tzdata
  Suse:
    - timezone

ntp_timezone_packages: "{{ _ntp_timezone_packages[ansible_facts['os_family']] | default(_ntp_timezone_packages['default']) }}"

_ntp_timezone_supported:
  default: false
  Debian: true
  RedHat: true

ntp_timezone_supported: "{{ _ntp_timezone_supported[ansible_facts['os_family']] | default(_ntp_timezone_supported['default']) }}"
