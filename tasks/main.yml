---
# tasks file for ntp

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Remove conflicting packages
  ansible.builtin.package:
    name: "{{ ntp_conflicting_packages }}"
    state: absent
  when:
    - ntp_conflicting_packages | length > 0

- name: Install packages
  ansible.builtin.package:
    name: "{{ ntp_packages }}"
    state: present

- name: Configure {{ ntp_configuration_directory }}/{{ ntp_configuration_file }}
  ansible.builtin.template:
    src: "{{ ntp_configuration_file }}.j2"
    dest: "{{ ntp_configuration_directory }}/{{ ntp_configuration_file }}"
    mode: "0644"
  notify:
    - Restart ntp

- name: Install timezone information
  ansible.builtin.package:
    name: "{{ ntp_timezone_packages }}"
    state: present

- name: Configure timezone
  community.general.timezone:
    name: "{{ ntp_timezone }}"
  when:
    - ntp_timezone_supported

- name: Manage {{ ntp_service }}
  ansible.builtin.service:
    name: "{{ ntp_service }}"
    state: "{{ ntp_state }}"
    enabled: "{{ ntp_enabled }}"
